<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リカ・クエスト｜6人の主人公</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17152f;color:#fff8e4;font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
main{max-width:1240px;margin:auto;padding:36px 40px 20px}
header{display:flex;align-items:center;gap:15px;padding-bottom:22px;border-bottom:1px solid #736b91}
header svg{width:45px;height:45px}
h1,h2,p{margin:0}
h1{font-size:30px;line-height:1.2}
header p{margin-left:auto;font-size:16px;color:#d5cbe5}
.lineup,.exports{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.lineup{padding-top:22px}
article{--accent:#89e2d1;--shade:#23415a;min-width:0}
article:nth-child(3n+2){--accent:#ffd37a;--shade:#44405a}
article:nth-child(3n){--accent:#d3bbff;--shade:#3d365e}
.stage{position:relative;isolation:isolate;background:linear-gradient(155deg,var(--shade),#26223f 83%);border-top:3px solid var(--accent);overflow:hidden;min-height:360px}
.stage:before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(#d7f0ff08 1px,transparent 1px),linear-gradient(90deg,#d7f0ff08 1px,transparent 1px);background-size:24px 24px}
.lab{display:flex;gap:8px;align-items:center;color:var(--accent);font-size:13px;font-weight:700;padding:13px 15px 0}
.lab b{color:#211f37;background:var(--accent);width:24px;height:24px;display:grid;place-items:center;font-size:15px}
.plate{position:absolute;left:6%;width:88%;top:16%;height:77%;z-index:-1;color:var(--accent);opacity:.42}
.figure{height:320px;display:grid;place-items:center}
.figure svg{height:100%;width:100%;max-width:300px;filter:drop-shadow(0 3px 1px #12102355)}
figcaption{display:block;padding:13px 0 15px;border-bottom:1px solid #615770}
h2{font-size:26px;color:#fff7e6}
h2 small{display:block;color:var(--accent);font-size:14px;margin-bottom:2px}
figcaption p{color:#e9e0ef;font-size:16px;line-height:1.65;margin-top:3px}
figure{margin:0}
.exports{margin-top:12px}
a{min-height:44px;display:inline-flex;width:fit-content;align-items:center;gap:8px;color:#cbd5e7;font-weight:600;font-size:14px;text-underline-offset:4px}
a svg{width:16px;height:16px}
a:focus-visible{outline:3px solid #fbd056;outline-offset:3px}
@media(max-width:760px){main{padding:20px 16px}.lineup{gap:24px;grid-template-columns:1fr}.stage{min-height:300px}.figure{height:265px}header{flex-wrap:wrap;gap:8px}header p{margin-left:0;width:100%}.exports{display:flex;flex-wrap:wrap;gap:12px}}
</style>
</head>
<body>
<main>
<div id="sheet">
<header><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 7H31M20 8V20L8 38Q7 41 12 41H36Q41 41 39 37L28 20V8" fill="none" stroke="#94e7d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 30Q21 27 25 31Q29 33 32 30L36 37H12Z" fill="#94e7d8"/><path d="M38 6L39 10L43 11L39 12L38 17L37 12L33 11L37 10Z" fill="#ffd37a"/></svg><h1>リカ・クエスト</h1><p>えらべる6人の科学探検家</p></header>
<div class="lineup">
<article data-hero="aoi"><figure><div class="stage"><div class="lab"><b>A</b> CHEMISTRY</div><div class="figure"></div></div><figcaption><h2><small>結晶研究の</small>アオイ</h2><p>白衣をひるがえし、フラスコの光に目をこらす。</p></figcaption></figure></article>
<article data-hero="jin"><figure><div class="stage"><div class="lab"><b>B</b> ENGINEERING</div><div class="figure"></div></div><figcaption><h2><small>電気工作の</small>ジン</h2><p>手回し発電機に明かりがともると、思わずひと跳び。</p></figcaption></figure></article>
<article data-hero="sora"><figure><div class="stage"><div class="lab"><b>C</b> ASTRONOMY</div><div class="figure"></div></div><figcaption><h2><small>星空観測の</small>ソラ</h2><p>星図のマントをまとい、望遠鏡で夜空をたどる。</p></figcaption></figure></article>
<article data-hero="mio"><figure><div class="stage"><div class="lab"><b>D</b> CHEMISTRY</div><div class="figure"></div></div><figcaption><h2><small>結晶研究の</small>ミオ</h2><p>ルーペをのぞいて、結晶の面が光る角度を探す。</p></figcaption></figure></article>
<article data-hero="ritsu"><figure><div class="stage"><div class="lab"><b>E</b> ENGINEERING</div><div class="figure"></div></div><figcaption><h2><small>電気工作の</small>リツ</h2><p>手づくりのモーターで、プロペラに風を起こす。</p></figcaption></figure></article>
<article data-hero="nagi"><figure><div class="stage"><div class="lab"><b>F</b> ASTRONOMY</div><div class="figure"></div></div><figcaption><h2><small>星空観測の</small>ナギ</h2><p>星座早見盤を片手に、今夜いちばんの星を見つけた。</p></figcaption></figure></article>
</div></div>
<nav class="exports" aria-label="キャラクターをSVGで保存"></nav>
</main>
<script src="../js/hero-studies.js"></script>
<script>
(function(){
  const plate='<svg class="plate" aria-hidden="true" viewBox="0 0 240 240" fill="none" stroke="currentColor"><circle cx="120" cy="120" r="101" stroke-dasharray="1 5"/><path d="M17 115 A103 103 0 0 1 77 28 M171 30 A103 103 0 0 1 219 100 M222 133 A103 103 0 0 1 188 198 M48 193 A103 103 0 0 1 22 151 M10 120H26 M214 120H230 M120 10V25 M120 216V230"/><path d="M4 19V5H18 M222 5H236V19 M236 221V235H222 M18 235H4V221" opacity=".7"/></svg>';
  document.querySelectorAll('[data-hero]').forEach(function(article){
    const art=window.RikaHeroStudies.render(article.dataset.hero);
    article.querySelector('.figure').innerHTML=art;
    article.querySelector('.stage').insertAdjacentHTML('afterbegin',plate);
    const link=document.createElement('a');
    link.href=URL.createObjectURL(new Blob([art],{type:'image/svg+xml'}));
    link.download=article.dataset.hero+'.svg';
    link.textContent=article.querySelector('h2').lastChild.textContent+'のSVGを保存';
    document.querySelector('.exports').append(link);
  });
})();
</script>
</body></html>
